version: "3.9"

# =============================================================================
# PCH MSA — Production Docker Compose
# Startup order: infra → discovery → gateway → application services
# =============================================================================

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - pch-network
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-spring-defaults: &spring-defaults
  SPRING_PROFILES_ACTIVE: prod
  TZ: Asia/Seoul

# =============================================================================
# SERVICES
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE — MySQL
  # ---------------------------------------------------------------------------
  mysql:
    <<: *service-defaults
    image: mysql:8.4
    container_name: pch-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-pchuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=500
      - --innodb-buffer-pool-size=512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE — Redis
  # ---------------------------------------------------------------------------
  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    container_name: pch-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword}
      --maxmemory ${REDIS_MAX_MEMORY:-256mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE — Kafka (KRaft mode, no ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.7.1
    container_name: pch-kafka
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Broker config
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE — Elasticsearch (single-node, security disabled)
  # ---------------------------------------------------------------------------
  elasticsearch:
    <<: *service-defaults
    image: elasticsearch:8.15.3
    container_name: pch-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      cluster.name: pch-cluster
      node.name: pch-node-1
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${ES_HOST_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------------------
  # MONITORING — Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *service-defaults
    image: prom/prometheus:v2.54.1
    container_name: pch-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ---------------------------------------------------------------------------
  # MONITORING — Grafana
  # ---------------------------------------------------------------------------
  grafana:
    <<: *service-defaults
    image: grafana/grafana:11.2.2
    container_name: pch-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-adminpassword}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ===========================================================================
  # APPLICATION SERVICES — Layer 1: Discovery
  # ===========================================================================

  pch-discovery:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-discovery
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-discovery:${IMAGE_TAG:-latest}
    container_name: pch-discovery
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8761
      EUREKA_INSTANCE_HOSTNAME: pch-discovery
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      - "${DISCOVERY_HOST_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M

  # ===========================================================================
  # APPLICATION SERVICES — Layer 2: Gateway
  # ===========================================================================

  pch-gateway:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-gateway
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-gateway:${IMAGE_TAG:-latest}
    container_name: pch-gateway
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8000
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_DATABASE: ${GATEWAY_REDIS_DB:-0}
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  # ===========================================================================
  # APPLICATION SERVICES — Layer 3: Business Services
  # ===========================================================================

  pch-auth-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-auth-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-auth-service:${IMAGE_TAG:-latest}
    container_name: pch-auth-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${AUTH_DB_NAME:-pch_auth}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pchuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_DATABASE: ${AUTH_REDIS_DB:-1}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      # JWT
      JWT_SECRET: ${JWT_SECRET:-changeme-jwt-secret-at-least-32-chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
    ports:
      - "${AUTH_HOST_PORT:-8081}:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-project-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-project-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-project-service:${IMAGE_TAG:-latest}
    container_name: pch-project-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8082
      SERVER_SERVLET_CONTEXT_PATH: /project
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${PROJECT_DB_NAME:-pch_project}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pchuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${PROJECT_KAFKA_GROUP_ID:-pch-project-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${PROJECT_HOST_PORT:-8082}:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/project/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-issue-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-issue-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-issue-service:${IMAGE_TAG:-latest}
    container_name: pch-issue-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8083
      SERVER_SERVLET_CONTEXT_PATH: /issue
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${ISSUE_DB_NAME:-pch_issue}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pchuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_DATABASE: ${ISSUE_REDIS_DB:-2}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${ISSUE_KAFKA_GROUP_ID:-pch-issue-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${ISSUE_HOST_PORT:-8083}:8083"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8083/issue/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-board-report-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-board-report-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-board-report-service:${IMAGE_TAG:-latest}
    container_name: pch-board-report-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8084
      SERVER_SERVLET_CONTEXT_PATH: /board-report
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${BOARD_REPORT_DB_NAME:-pch_board_report}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pchuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_DATABASE: ${BOARD_REPORT_REDIS_DB:-3}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${BOARD_REPORT_KAFKA_GROUP_ID:-pch-board-report-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${BOARD_REPORT_HOST_PORT:-8084}:8084"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/board-report/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-search-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-search-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-search-service:${IMAGE_TAG:-latest}
    container_name: pch-search-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8085
      SERVER_SERVLET_CONTEXT_PATH: /search
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # Elasticsearch
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_CONNECTION_TIMEOUT: 5s
      SPRING_ELASTICSEARCH_SOCKET_TIMEOUT: 30s
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${SEARCH_KAFKA_GROUP_ID:-pch-search-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${SEARCH_HOST_PORT:-8085}:8085"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/search/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-notification-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-notification-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-notification-service:${IMAGE_TAG:-latest}
    container_name: pch-notification-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8086
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${NOTIFICATION_DB_NAME:-pch_notification}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pchuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_DATABASE: ${NOTIFICATION_REDIS_DB:-4}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${NOTIFICATION_KAFKA_GROUP_ID:-pch-notification-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${NOTIFICATION_HOST_PORT:-8086}:8086"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-file-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-file-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-file-service:${IMAGE_TAG:-latest}
    container_name: pch-file-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8087
      SERVER_SERVLET_CONTEXT_PATH: /file
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # S3
      CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      CLOUD_AWS_REGION_STATIC: ${AWS_REGION:-ap-northeast-2}
      CLOUD_AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      CLOUD_AWS_STACK_AUTO: "false"
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${FILE_KAFKA_GROUP_ID:-pch-file-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${FILE_HOST_PORT:-8087}:8087"
    depends_on:
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/file/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

  pch-integration-service:
    <<: *service-defaults
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        SERVICE: pch-integration-service
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-pch-msa}/pch-integration-service:${IMAGE_TAG:-latest}
    container_name: pch-integration-service
    environment:
      <<: *spring-defaults
      SERVER_PORT: 8088
      SERVER_SERVLET_CONTEXT_PATH: /integration
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://pch-discovery:8761/eureka/
      # MySQL
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${INTEGRATION_DB_NAME:-pch_integration}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-pchuser}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-pchpassword}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_DATABASE: ${INTEGRATION_REDIS_DB:-5}
      # Kafka
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.springframework.kafka.support.serializer.JsonSerializer
      SPRING_KAFKA_CONSUMER_GROUP_ID: ${INTEGRATION_KAFKA_GROUP_ID:-pch-integration-group}
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.springframework.kafka.support.serializer.JsonDeserializer
    ports:
      - "${INTEGRATION_HOST_PORT:-8088}:8088"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      pch-discovery:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8088/integration/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  pch-network:
    driver: bridge
    name: pch-network

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  mysql-data:
    name: pch-mysql-data
  redis-data:
    name: pch-redis-data
  kafka-data:
    name: pch-kafka-data
  elasticsearch-data:
    name: pch-elasticsearch-data
  prometheus-data:
    name: pch-prometheus-data
  grafana-data:
    name: pch-grafana-data
