groups:
  - name: service_alerts
    rules:
      # 1. 서비스 다운
      - alert: ServiceDown
        expr: up{job=~"pch-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} ({{ $labels.instance }}) has been down for more than 1 minute."

      # 2. 높은 응답시간
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{status!~"5.."}[5m])) by (le, service)) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 response time on {{ $labels.service }}"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 200ms)"

      # 3. 높은 에러율
      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (service)
          / sum(rate(http_server_requests_seconds_count[5m])) by (service) > 0.001
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 0.1%)"

      # 4. 높은 CPU 사용량
      - alert: HighCpuUsage
        expr: process_cpu_usage{job=~"pch-.*"} > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      # 5. 높은 메모리 사용량
      - alert: HighMemoryUsage
        expr: jvm_memory_used_bytes{area="heap", job=~"pch-.*"} > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High heap memory on {{ $labels.job }}"
          description: "Heap usage is {{ $value | humanize1024 }}B (threshold: 1GB)"

  - name: infrastructure_alerts
    rules:
      # 6. DB 연결 풀 고갈
      - alert: DbPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DB pool near exhaustion on {{ $labels.job }}"
          description: "Active connections: {{ $value | humanizePercentage }} of max"

      # 7. Kafka Consumer Lag
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag_sum > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag for {{ $labels.consumergroup }}"
          description: "Lag: {{ $value }} messages"

      # 8. Redis 메모리
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 90%"
          description: "Used: {{ $value | humanizePercentage }}"

      # 9. Elasticsearch 클러스터 상태
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Elasticsearch cluster is RED"
          description: "Cluster health is red — data loss risk"

      # 10. 느린 쿼리
      - alert: SlowQueries
        expr: increase(mysql_global_status_slow_queries[5m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL slow queries detected"
          description: "{{ $value }} slow queries in the last 5 minutes"
