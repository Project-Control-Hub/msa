---
# ── pch-gateway Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pch-gateway
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-gateway
    app.kubernetes.io/part-of: pch-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pch-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pch-gateway
        app.kubernetes.io/part-of: pch-msa
    spec:
      containers:
        - name: pch-gateway
          image: ghcr.io/OWNER/pch-msa/pch-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: pch-common-config
            - secretRef:
                name: pch-common-secret
          env:
            - name: SPRING_DATA_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: pch-common-config
                  key: REDIS_HOST
            - name: SPRING_DATA_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: pch-common-config
                  key: REDIS_PORT
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

---
# ── pch-gateway Service ──────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pch-gateway
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-gateway
    app.kubernetes.io/part-of: pch-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pch-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
