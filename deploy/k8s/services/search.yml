---
# ── pch-search-service Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pch-search-service
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-search-service
    app.kubernetes.io/part-of: pch-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pch-search-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pch-search-service
        app.kubernetes.io/part-of: pch-msa
    spec:
      containers:
        - name: pch-search-service
          image: ghcr.io/OWNER/pch-msa/pch-search-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: pch-common-config
            - secretRef:
                name: pch-common-secret
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/search"
            - name: SPRING_ELASTICSEARCH_URIS
              valueFrom:
                configMapKeyRef:
                  name: pch-common-config
                  key: ELASTICSEARCH_URIS
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: pch-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

---
# ── pch-search-service Service ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pch-search-service
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-search-service
    app.kubernetes.io/part-of: pch-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pch-search-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
