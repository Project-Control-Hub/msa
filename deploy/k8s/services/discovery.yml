---
# ── pch-discovery Deployment ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pch-discovery
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-discovery
    app.kubernetes.io/part-of: pch-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pch-discovery
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pch-discovery
        app.kubernetes.io/part-of: pch-msa
    spec:
      containers:
        - name: pch-discovery
          image: ghcr.io/OWNER/pch-msa/pch-discovery:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
              name: http
          envFrom:
            - configMapRef:
                name: pch-common-config
          resources:
            requests:
              cpu: 256m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

---
# ── pch-discovery Service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pch-discovery
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-discovery
    app.kubernetes.io/part-of: pch-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pch-discovery
  ports:
    - name: http
      port: 8761
      targetPort: 8761
