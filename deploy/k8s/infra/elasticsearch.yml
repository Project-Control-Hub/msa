---
# ── Elasticsearch 8.17 StatefulSet (single-node, security disabled) ──────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pch-elasticsearch
  namespace: pch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: pch-msa
spec:
  serviceName: pch-elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/part-of: pch-msa
    spec:
      initContainers:
        # ES requires vm.max_map_count >= 262144
        - name: sysctl
          image: busybox:1.36
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: cluster.name
              value: "pch-elasticsearch"
            - name: node.name
              value: "pch-es-node-0"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: es-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 15Gi

---
# ── Elasticsearch Service ────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pch-elasticsearch
  namespace: pch
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: pch-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
