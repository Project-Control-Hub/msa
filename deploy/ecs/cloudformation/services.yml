AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PCH MSA — ECS Services Stack.
  ECS Task Definitions and Services for all 10 microservices with Fargate launch type,
  Service Discovery, health checks, SSM parameter references, and CloudWatch logging.

# ──────────────────────────────────────────────
#  Parameters
# ──────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Deployment environment

  NetworkStackName:
    Type: String
    Default: pch-msa-dev-network
    Description: VPC network CloudFormation stack name

  ClusterStackName:
    Type: String
    Default: pch-msa-dev-cluster
    Description: ECS cluster CloudFormation stack name

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy (e.g., git SHA or semver)

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Desired number of ECS task instances per service

  # Image URI overrides per service (populated by CD pipeline)
  DiscoveryImageUri:
    Type: String
    Default: ""
    Description: Full ECR image URI for pch-discovery (leave empty to use cluster stack export)

  GatewayImageUri:
    Type: String
    Default: ""

  AuthServiceImageUri:
    Type: String
    Default: ""

  ProjectServiceImageUri:
    Type: String
    Default: ""

  IssueServiceImageUri:
    Type: String
    Default: ""

  BoardReportServiceImageUri:
    Type: String
    Default: ""

  SearchServiceImageUri:
    Type: String
    Default: ""

  NotificationServiceImageUri:
    Type: String
    Default: ""

  FileServiceImageUri:
    Type: String
    Default: ""

  IntegrationServiceImageUri:
    Type: String
    Default: ""

# ──────────────────────────────────────────────
#  Conditions
# ──────────────────────────────────────────────
Conditions:
  UseDiscoveryImageOverride: !Not [!Equals [!Ref DiscoveryImageUri, ""]]
  UseGatewayImageOverride: !Not [!Equals [!Ref GatewayImageUri, ""]]
  UseAuthServiceImageOverride: !Not [!Equals [!Ref AuthServiceImageUri, ""]]
  UseProjectServiceImageOverride: !Not [!Equals [!Ref ProjectServiceImageUri, ""]]
  UseIssueServiceImageOverride: !Not [!Equals [!Ref IssueServiceImageUri, ""]]
  UseBoardReportServiceImageOverride: !Not [!Equals [!Ref BoardReportServiceImageUri, ""]]
  UseSearchServiceImageOverride: !Not [!Equals [!Ref SearchServiceImageUri, ""]]
  UseNotificationServiceImageOverride: !Not [!Equals [!Ref NotificationServiceImageUri, ""]]
  UseFileServiceImageOverride: !Not [!Equals [!Ref FileServiceImageUri, ""]]
  UseIntegrationServiceImageOverride: !Not [!Equals [!Ref IntegrationServiceImageUri, ""]]

# ──────────────────────────────────────────────
#  Resources
# ──────────────────────────────────────────────
Resources:

  # ═══════════════════════════════════════════════
  #  1. pch-discovery  (port 8761)
  #     CPU: 256  MEM: 512  —  lightweight registry
  # ═══════════════════════════════════════════════
  DiscoveryServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: pch-discovery
      NamespaceId:
        Fn::ImportValue: !Sub "${ClusterStackName}-ServiceDiscoveryNamespaceId"
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  DiscoveryTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "pch-msa-${Environment}-pch-discovery"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ClusterStackName}-TaskExecutionRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ClusterStackName}-TaskRoleArn"
      ContainerDefinitions:
        - Name: pch-discovery
          Image: !If
            - UseDiscoveryImageOverride
            - !Ref DiscoveryImageUri
            - !Sub
              - "${Uri}:${ImageTag}"
              - Uri:
                  Fn::ImportValue: !Sub "${ClusterStackName}-EcrDiscoveryUri"
          PortMappings:
            - ContainerPort: 8761
              Protocol: tcp
          Essential: true
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Ref Environment
            - Name: SERVER_PORT
              Value: "8761"
            - Name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              Value: health,info,metrics,prometheus
          HealthCheck:
            Command:
              - CMD-SHELL
              - "wget -qO- http://localhost:8761/actuator/health || exit 1"
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/pch-msa/${Environment}/pch-discovery"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          StopTimeout: 30
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  DiscoveryEcsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "pch-msa-${Environment}-pch-discovery"
      Cluster:
        Fn::ImportValue: !Sub "${ClusterStackName}-ClusterArn"
      TaskDefinition: !Ref DiscoveryTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-EcsTaskSecurityGroupId"
      ServiceRegistries:
        - RegistryArn: !GetAtt DiscoveryServiceDiscovery.Arn
          Port: 8761
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ═══════════════════════════════════════════════
  #  2. pch-gateway  (port 8000)
  # ═══════════════════════════════════════════════
  GatewayServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: pch-gateway
      NamespaceId:
        Fn::ImportValue: !Sub "${ClusterStackName}-ServiceDiscoveryNamespaceId"
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
        RoutingPolicy: MULTIVALUE
      HealthCheckCustomConfig:
        FailureThreshold: 1
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "pch-msa-${Environment}-pch-gateway"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn:
        Fn::ImportValue: !Sub "${ClusterStackName}-TaskExecutionRoleArn"
      TaskRoleArn:
        Fn::ImportValue: !Sub "${ClusterStackName}-TaskRoleArn"
      ContainerDefinitions:
        - Name: pch-gateway
          Image: !If
            - UseGatewayImageOverride
            - !Ref GatewayImageUri
            - !Sub
              - "${Uri}:${ImageTag}"
              - Uri:
                  Fn::ImportValue: !Sub "${ClusterStackName}-EcrGatewayUri"
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Essential: true
          Environment:
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Ref Environment
            - Name: SERVER_PORT
              Value: "8000"
            - Name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              Value: "http://pch-discovery.pch.local:8761/eureka/"
            - Name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              Value: health,info,metrics,prometheus
          Secrets:
            - Name: SPRING_DATA_REDIS_HOST
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pch-msa/${Environment}/redis/host"
            - Name: SPRING_DATA_REDIS_PORT
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pch-msa/${Environment}/redis/port"
            - Name: JWT_SECRET
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pch-msa/${Environment}/jwt/secret"
          HealthCheck:
            Command:
              - CMD-SHELL
              - "wget -qO- http://localhost:8000/actuator/health || exit 1"
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 90
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Sub "/ecs/pch-msa/${Environment}/pch-gateway"
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          StopTimeout: 30
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  GatewayEcsService:
    Type: AWS::ECS::Service
    DependsOn: DiscoveryEcsService
    Properties:
      ServiceName: !Sub "pch-msa-${Environment}-pch-gateway"
      Cluster:
        Fn::ImportValue: !Sub "${ClusterStackName}-ClusterArn"
      TaskDefinition: !Ref GatewayTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
            - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${NetworkStackName}-EcsTaskSecurityGroupId"
      LoadBalancers:
        - ContainerName: pch-gateway
          ContainerPort: 8000
          TargetGroupArn:
            Fn::ImportValue: !Sub "${ClusterStackName}-GatewayTargetGroupArn"
      ServiceRegistries:
        - RegistryArn: !GetAtt GatewayServiceDiscovery.Arn
          Port: 8000
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

