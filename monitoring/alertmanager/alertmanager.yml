global:
  resolve_timeout: 5m

route:
  receiver: "slack-default"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical → 즉시 #incidents
    - receiver: "slack-critical"
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

    # Warning → 5분 그룹핑 #alerts
    - receiver: "slack-warning"
      match:
        severity: warning

inhibit_rules:
  # ServiceDown이 활성이면 HighResponseTime 억제
  - source_matchers:
      - severity = critical
      - alertname = ServiceDown
    target_matchers:
      - severity = warning
      - alertname = HighResponseTime
    equal: ["service"]

  # ServiceDown이 활성이면 HighErrorRate 억제
  - source_matchers:
      - severity = critical
      - alertname = ServiceDown
    target_matchers:
      - severity = warning
      - alertname = HighErrorRate
    equal: ["service"]

receivers:
  - name: "slack-default"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true

  - name: "slack-critical"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#incidents"
        title: "🚨 [CRITICAL] {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
        color: "danger"

  - name: "slack-warning"
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        title: "⚠️ [WARNING] {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\n{{ end }}"
        send_resolved: true
        color: "warning"
