---
# ── pch-integration-service Deployment ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pch-integration-service
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-integration-service
    app.kubernetes.io/part-of: pch-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pch-integration-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pch-integration-service
        app.kubernetes.io/part-of: pch-msa
    spec:
      containers:
        - name: pch-integration-service
          image: ghcr.io/OWNER/pch-msa/pch-integration-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
              name: http
          envFrom:
            - configMapRef:
                name: pch-common-config
            - secretRef:
                name: pch-common-secret
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/integration"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://$(MYSQL_HOST):$(MYSQL_PORT)/pch_integration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
            - name: SPRING_DATASOURCE_USERNAME
              value: "pch_integration"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pch-common-secret
                  key: DB_PASSWORD_INTEGRATION
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: pch-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

---
# ── pch-integration-service Service ──────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pch-integration-service
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-integration-service
    app.kubernetes.io/part-of: pch-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pch-integration-service
  ports:
    - name: http
      port: 8088
      targetPort: 8088
