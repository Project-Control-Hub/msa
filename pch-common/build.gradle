// pch-common: 공유 라이브러리 (Spring Boot 플러그인 없이 순수 JAR)
// 모든 서비스 모듈이 이 라이브러리를 의존한다.

dependencies {
    // Validation (DTO 검증용)
    implementation 'jakarta.validation:jakarta.validation-api'

    // Jackson (이벤트/DTO 직렬화)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // JPA Auditing BaseEntity (compileOnly - JPA를 사용하는 서비스에서만 런타임 제공)
    compileOnly 'jakarta.persistence:jakarta.persistence-api'
    compileOnly 'org.springframework.data:spring-data-commons'

    // Spring Web (Filter, HttpHeaders 유틸)
    compileOnly 'org.springframework:spring-web'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'

    // Spring Security (JwtTokenProvider, SecurityContextUtil)
    compileOnly 'org.springframework.security:spring-security-core'

    // Kafka (DomainEventPublisher)
    compileOnly 'org.springframework.kafka:spring-kafka'

    // JWT
    compileOnly 'io.jsonwebtoken:jjwt-api:0.12.6'

    // SLF4J (로깅)
    compileOnly 'org.slf4j:slf4j-api'
}
