spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-key-for-unit-testing-at-least-32-chars
  access-token-validity-seconds: 300
  refresh-token-validity-seconds: 600
