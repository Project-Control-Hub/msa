AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PCH MSA — Managed Infrastructure Stack.
  Provisions RDS MySQL 8.0, ElastiCache Redis, Amazon MSK (Kafka),
  OpenSearch domain, and S3 bucket for file-service.
  All data-plane resources live in private subnets.

# ──────────────────────────────────────────────
#  Parameters
# ──────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, staging, prod]
    Default: dev
    Description: Deployment environment

  NetworkStackName:
    Type: String
    Default: pch-msa-dev-network
    Description: VPC network CloudFormation stack name

  # ── RDS ──────────────────────────────────────
  RdsInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.r6g.large
      - db.r6g.xlarge
    Description: RDS instance type

  RdsMasterUsername:
    Type: String
    Default: pch_admin
    NoEcho: false
    Description: RDS master username

  RdsMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS master password (stored in Secrets Manager; also update SSM params via setup-params.sh)

  RdsMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable Multi-AZ for RDS (set true for prod)

  RdsBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35

  RdsAllocatedStorageGb:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000

  # ── ElastiCache ───────────────────────────────
  RedisNodeType:
    Type: String
    Default: cache.t3.micro
    AllowedValues:
      - cache.t3.micro
      - cache.t3.small
      - cache.t3.medium
      - cache.r6g.large
      - cache.r6g.xlarge
    Description: ElastiCache Redis node type

  RedisNumCacheClusters:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 6
    Description: Number of Redis replica nodes (1 = no replicas)

  # ── MSK ───────────────────────────────────────
  MskInstanceType:
    Type: String
    Default: kafka.t3.small
    AllowedValues:
      - kafka.t3.small
      - kafka.m5.large
      - kafka.m5.xlarge
    Description: MSK broker instance type

  MskBrokerCount:
    Type: Number
    Default: 2
    AllowedValues: [2, 3, 6]
    Description: Number of MSK brokers (must be a multiple of AZ count)

  MskVolumeGb:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 16384

  # ── OpenSearch ────────────────────────────────
  OpenSearchInstanceType:
    Type: String
    Default: t3.small.search
    AllowedValues:
      - t3.small.search
      - t3.medium.search
      - m6g.large.search
      - m6g.xlarge.search
    Description: OpenSearch data node instance type

  OpenSearchVolumeGb:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 1000

  OpenSearchMasterUsername:
    Type: String
    Default: pch_os_admin
    Description: OpenSearch fine-grained access control master username

  OpenSearchMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: OpenSearch master password

# ──────────────────────────────────────────────
#  Conditions
# ──────────────────────────────────────────────
Conditions:
  IsMultiAZ: !Equals [!Ref RdsMultiAZ, "true"]
  IsProd: !Equals [!Ref Environment, prod]

# ──────────────────────────────────────────────
#  Resources
# ──────────────────────────────────────────────
Resources:

  # ─────────────────────────────────────────────
  #  RDS — DB Subnet Group
  # ─────────────────────────────────────────────
  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "PCH MSA ${Environment} RDS subnet group"
      SubnetIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
      Tags:
        - Key: Name
          Value: !Sub "pch-msa-${Environment}-rds-subnet-group"
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────
  #  RDS — MySQL 8.0 Parameter Group
  # ─────────────────────────────────────────────
  RdsParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: mysql8.0
      Description: !Sub "PCH MSA ${Environment} MySQL 8.0 parameter group"
      Parameters:
        character_set_server: utf8mb4
        collation_server: utf8mb4_unicode_ci
        max_connections: "500"
        slow_query_log: "1"
        long_query_time: "2"
        performance_schema: "1"
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────
  #  RDS — Single MySQL 8.0 Instance (shared)
  #  Note: In production, consider separate RDS
  #  instances per schema for isolation.
  # ─────────────────────────────────────────────
  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "pch-msa-${Environment}-mysql"
      DBInstanceClass: !Ref RdsInstanceClass
      Engine: mysql
      EngineVersion: "8.0"
      MasterUsername: !Ref RdsMasterUsername
      MasterUserPassword: !Ref RdsMasterPassword
      DBSubnetGroupName: !Ref RdsSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub "${NetworkStackName}-RdsSecurityGroupId"
      MultiAZ: !If [IsMultiAZ, true, false]
      StorageType: gp3
      AllocatedStorage: !Sub "${RdsAllocatedStorageGb}"
      MaxAllocatedStorage: !If [IsProd, 500, 100]
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref RdsBackupRetentionDays
      PreferredBackupWindow: "02:00-03:00"
      PreferredMaintenanceWindow: "Sun:04:00-Sun:05:00"
      DBParameterGroupName: !Ref RdsParameterGroup
      EnablePerformanceInsights: true
      PerformanceInsightsRetentionPeriod: !If [IsProd, 731, 7]
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt RdsEnhancedMonitoringRole.Arn
      EnableCloudwatchLogsExports:
        - error
        - slowquery
        - general
      CopyTagsToSnapshot: true
      DeletionProtection: !If [IsProd, true, false]
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub "pch-msa-${Environment}-mysql"
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  RdsEnhancedMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "pch-msa-${Environment}-rds-monitoring-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────
  #  ElastiCache — Redis Subnet Group
  # ─────────────────────────────────────────────
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub "pch-msa-${Environment}-redis-subnet-group"
      Description: !Sub "PCH MSA ${Environment} Redis subnet group"
      SubnetIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────
  #  ElastiCache — Redis Parameter Group
  # ─────────────────────────────────────────────
  RedisParameterGroup:
    Type: AWS::ElastiCache::ParameterGroup
    Properties:
      CacheParameterGroupFamily: redis7
      Description: !Sub "PCH MSA ${Environment} Redis 7 parameter group"
      Properties:
        maxmemory-policy: allkeys-lru
        notify-keyspace-events: ""
        activerehashing: "yes"

  # ─────────────────────────────────────────────
  #  ElastiCache — Redis Replication Group
  # ─────────────────────────────────────────────
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "pch-msa-${Environment}-redis"
      ReplicationGroupDescription: !Sub "PCH MSA ${Environment} Redis cluster"
      AutomaticFailoverEnabled: !If [IsProd, true, false]
      MultiAZEnabled: !If [IsProd, true, false]
      NumCacheClusters: !Ref RedisNumCacheClusters
      CacheNodeType: !Ref RedisNodeType
      Engine: redis
      EngineVersion: "7.0"
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${NetworkStackName}-ElastiCacheSecurityGroupId"
      CacheParameterGroupName: !Ref RedisParameterGroup
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      Port: 6379
      SnapshotRetentionLimit: !If [IsProd, 5, 1]
      SnapshotWindow: "03:00-04:00"
      PreferredMaintenanceWindow: "Sun:05:00-Sun:06:00"
      Tags:
        - Key: Name
          Value: !Sub "pch-msa-${Environment}-redis"
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────
  #  MSK — Kafka Cluster
  # ─────────────────────────────────────────────
  MskCluster:
    Type: AWS::MSK::Cluster
    Properties:
      ClusterName: !Sub "pch-msa-${Environment}-kafka"
      KafkaVersion: "3.5.1"
      NumberOfBrokerNodes: !Ref MskBrokerCount
      BrokerNodeGroupInfo:
        InstanceType: !Ref MskInstanceType
        ClientSubnets:
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet2Id"
        SecurityGroups:
          - Fn::ImportValue: !Sub "${NetworkStackName}-MskSecurityGroupId"
        StorageInfo:
          EBSStorageInfo:
            VolumeSize: !Ref MskVolumeGb
      ClientAuthentication:
        Sasl:
          Iam:
            Enabled: true
          Scram:
            Enabled: false
        Unauthenticated:
          Enabled: false
      EncryptionInfo:
        EncryptionAtRest:
          DataVolumeKMSKeyId: ""  # Uses AWS managed key by default
        EncryptionInTransit:
          ClientBroker: TLS
          InCluster: true
      EnhancedMonitoring: PER_TOPIC_PER_BROKER
      OpenMonitoring:
        Prometheus:
          JmxExporter:
            EnabledInBroker: true
          NodeExporter:
            EnabledInBroker: true
      LoggingInfo:
        BrokerLogs:
          CloudWatchLogs:
            Enabled: true
            LogGroup: !Sub "/aws/msk/pch-msa-${Environment}"
      ConfigurationInfo:
        Arn: !Ref MskConfiguration
        Revision: 1
      Tags:
        Project: pch-msa
        Environment: !Ref Environment

  MskConfiguration:
    Type: AWS::MSK::Configuration
    Properties:
      Name: !Sub "pch-msa-${Environment}-kafka-config"
      Description: !Sub "PCH MSA ${Environment} Kafka configuration"
      KafkaVersionsList:
        - "3.5.1"
      ServerProperties: |
        auto.create.topics.enable=false
        default.replication.factor=2
        min.insync.replicas=1
        num.io.threads=8
        num.network.threads=5
        num.partitions=3
        num.replica.fetchers=2
        socket.request.max.bytes=104857600
        unclean.leader.election.enable=true
        log.retention.hours=168
        log.segment.bytes=1073741824
        log.retention.check.interval.ms=300000
        offsets.topic.replication.factor=2

  MskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/msk/pch-msa-${Environment}"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  # ─────────────────────────────────────────────
  #  OpenSearch — Domain
  # ─────────────────────────────────────────────
  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub "pch-msa-${Environment}"
      EngineVersion: "OpenSearch_2.9"
      ClusterConfig:
        InstanceType: !Ref OpenSearchInstanceType
        InstanceCount: !If [IsProd, 2, 1]
        DedicatedMasterEnabled: !If [IsProd, true, false]
        DedicatedMasterType: !If [IsProd, "m6g.large.search", !Ref AWS::NoValue]
        DedicatedMasterCount: !If [IsProd, 3, !Ref AWS::NoValue]
        MultiAZWithStandbyEnabled: false
        ZoneAwarenessEnabled: !If [IsProd, true, false]
        ZoneAwarenessConfig: !If
          - IsProd
          - AvailabilityZoneCount: 2
          - !Ref AWS::NoValue
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !Ref OpenSearchVolumeGb
      VPCOptions:
        SubnetIds:
          - Fn::ImportValue: !Sub "${NetworkStackName}-PrivateSubnet1Id"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${NetworkStackName}-OpenSearchSecurityGroupId"
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Ref OpenSearchMasterUsername
          MasterUserPassword: !Ref OpenSearchMasterPassword
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "*"
            Action: "es:*"
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/pch-msa-${Environment}/*"
            Condition:
              StringEquals:
                aws:PrincipalVpc:
                  Fn::ImportValue: !Sub "${NetworkStackName}-VpcId"
      LogPublishingOptions:
        INDEX_SLOW_LOGS:
          Enabled: true
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchSlowLogGroup.Arn
        SEARCH_SLOW_LOGS:
          Enabled: true
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchSlowLogGroup.Arn
        ES_APPLICATION_LOGS:
          Enabled: true
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchAppLogGroup.Arn
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  OpenSearchSlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/opensearch/pch-msa-${Environment}/slow-logs"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  OpenSearchAppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/opensearch/pch-msa-${Environment}/application"
      RetentionInDays: 14
      Tags:
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  OpenSearchLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub "pch-msa-${Environment}-opensearch-logs"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "es.amazonaws.com"
              },
              "Action": [
                "logs:CreateLogStream",
                "logs:PutLogEvents",
                "logs:PutLogEventsBatch"
              ],
              "Resource": "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/opensearch/pch-msa-${Environment}/*"
            }
          ]
        }

  # ─────────────────────────────────────────────
  #  S3 — File Service Bucket
  # ─────────────────────────────────────────────
  FileServiceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "pch-msa-${Environment}-files-${AWS::AccountId}"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [IsProd, Enabled, Suspended]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ["*"]
            MaxAge: 3600
      Tags:
        - Key: Name
          Value: !Sub "pch-msa-${Environment}-files"
        - Key: Project
          Value: pch-msa
        - Key: Environment
          Value: !Ref Environment

  FileServiceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FileServiceBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt FileServiceBucket.Arn
              - !Sub "${FileServiceBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

# ──────────────────────────────────────────────
#  Outputs
# ──────────────────────────────────────────────
Outputs:
  RdsEndpoint:
    Description: RDS MySQL endpoint
    Value: !GetAtt RdsInstance.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RdsEndpoint"

  RdsPort:
    Description: RDS MySQL port
    Value: !GetAtt RdsInstance.Endpoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-RdsPort"

  RedisEndpoint:
    Description: Redis primary endpoint
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RedisEndpoint"

  RedisPort:
    Description: Redis port
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port
    Export:
      Name: !Sub "${AWS::StackName}-RedisPort"

  RedisReaderEndpoint:
    Description: Redis reader endpoint
    Value: !GetAtt RedisReplicationGroup.ReaderEndPoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-RedisReaderEndpoint"

  MskClusterArn:
    Description: MSK Cluster ARN
    Value: !Ref MskCluster
    Export:
      Name: !Sub "${AWS::StackName}-MskClusterArn"

  OpenSearchEndpoint:
    Description: OpenSearch domain endpoint
    Value: !GetAtt OpenSearchDomain.DomainEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-OpenSearchEndpoint"

  OpenSearchDomainArn:
    Description: OpenSearch domain ARN
    Value: !GetAtt OpenSearchDomain.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OpenSearchDomainArn"

  FileServiceBucketName:
    Description: S3 bucket name for file-service
    Value: !Ref FileServiceBucket
    Export:
      Name: !Sub "${AWS::StackName}-FileServiceBucketName"

  FileServiceBucketArn:
    Description: S3 bucket ARN for file-service
    Value: !GetAtt FileServiceBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-FileServiceBucketArn"
