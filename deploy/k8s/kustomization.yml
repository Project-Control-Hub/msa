apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pch

resources:
  # 1. Namespace first
  - namespace.yml

  # 2. Shared configuration
  - configmap.yml
  - secrets.yml

  # 3. Infrastructure (StatefulSets + Services)
  - infra/mysql.yml
  - infra/redis.yml
  - infra/kafka.yml
  - infra/elasticsearch.yml

  # 4. Application services (discovery must be before others for Eureka)
  - services/discovery.yml
  - services/gateway.yml
  - services/auth.yml
  - services/project.yml
  - services/issue.yml
  - services/board-report.yml
  - services/search.yml
  - services/notification.yml
  - services/file.yml
  - services/integration.yml

  # 5. Ingress
  - gateway-ingress.yml
