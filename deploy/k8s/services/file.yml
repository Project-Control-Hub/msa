---
# ── pch-file-service Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pch-file-service
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-file-service
    app.kubernetes.io/part-of: pch-msa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pch-file-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pch-file-service
        app.kubernetes.io/part-of: pch-msa
    spec:
      containers:
        - name: pch-file-service
          image: ghcr.io/OWNER/pch-msa/pch-file-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8087
              name: http
          envFrom:
            - configMapRef:
                name: pch-common-config
            - secretRef:
                name: pch-common-secret
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/file"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: pch-common-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            # S3 configuration — set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
            # AWS_REGION, S3_BUCKET_NAME via additional secret or env injection.
            - name: AWS_REGION
              value: "ap-northeast-2"
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

---
# ── pch-file-service Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: pch-file-service
  namespace: pch
  labels:
    app.kubernetes.io/name: pch-file-service
    app.kubernetes.io/part-of: pch-msa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pch-file-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
